<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EsGame Задание</title>
    <style>
        :root { 
            --bg-primary: #064e3b; 
            --bg-secondary: #10b981;
            --blob-1: rgba(16, 185, 129, 0.35);
            --blob-2: rgba(4, 120, 87, 0.3);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            margin: 0; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            font-family: 'Segoe UI', -apple-system, sans-serif; 
            overflow-x: hidden; 
            transition: background 1.5s ease;
            background: var(--bg-primary);
            padding: 20px;
        }
        
        .bg-animate { 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
            background: linear-gradient(135deg, var(--bg-primary), var(--bg-secondary));
            background-size: 300% 300%; 
            animation: gradientBG 15s ease infinite; 
            overflow: hidden;
        }

        .bg-animate::after {
            content: "";
            position: absolute; inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
        }

        .blob {
            position: absolute; border-radius: 50%; filter: blur(90px);
            pointer-events: none; opacity: 0.8;
            animation: floatBlob 12s infinite alternate ease-in-out;
        }

        .blob-1 { width: 450px; height: 450px; background: var(--blob-1); top: -100px; left: -100px; animation-duration: 14s; }
        .blob-2 { width: 500px; height: 500px; background: var(--blob-2); bottom: -150px; right: -150px; animation-duration: 18s; animation-direction: alternate-reverse; }

        @keyframes gradientBG { 
            0% { background-position: 0% 50%; } 
            50% { background-position: 100% 50%; } 
            100% { background-position: 0% 50%; } 
        }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(80px, 50px) scale(1.15); }
            100% { transform: translate(-50px, 100px) scale(0.95); }
        }

        .main-card {
            width: 100%;
            max-width: 550px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 30px 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .main-card:hover {
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.15);
        }

        .logo { 
            width: 100%; 
            max-width: 320px; 
            margin-bottom: 20px; 
            object-fit: contain; 
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.2));
        }
        
        h1 { 
            font-weight: 400; 
            letter-spacing: 0.5px; 
            margin: 0 0 20px 0; 
            font-size: 1.4rem; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .play-btn {
            width: 75px; height: 75px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s;
            margin: 10px 0;
        }
        .play-btn:hover { background: rgba(255, 255, 255, 0.25); }
        .play-btn:active { transform: scale(0.9); }
        
        #desc-box { 
            opacity: 0; 
            transform: translateY(15px); 
            transition: 0.8s cubic-bezier(0.16, 1, 0.3, 1); 
            width: 100%; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #descText { 
            font-size: 1.05rem; 
            line-height: 1.5; 
            margin: 0 0 20px 0; 
            min-height: 40px; 
            padding: 0 10px;
        }

        .btn-group { 
            display: flex; 
            gap: 15px; 
            opacity: 0; 
            transition: 0.8s; 
            justify-content: center; 
            margin-bottom: 15px; 
            width: 100%;
        }
        
        button.choice { 
            padding: 12px 30px; 
            border-radius: 30px; 
            border: none; 
            font-weight: 600; 
            cursor: pointer; 
            color: white; 
            font-size: 1rem;
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255,255,255,0.25);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transition: transform 0.2s, background 0.3s, box-shadow 0.3s; 
        }
        button.choice:hover { box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        button.choice:active { transform: scale(0.95); }
        
        .choice-yes { background: rgba(34, 197, 94, 0.5); }
        .choice-yes:hover { background: rgba(34, 197, 94, 0.7); }

        .choice-no { background: rgba(239, 68, 68, 0.5); }
        .choice-no:hover { background: rgba(239, 68, 68, 0.7); }

        #warningBox {
            display: none;
            background: rgba(239, 68, 68, 0.35);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            border-radius: 16px;
            padding: 14px 18px;
            margin-top: 10px;
            font-size: 0.95rem;
            line-height: 1.4;
            width: 100%;
            animation: fadeInWarning 0.5s ease forwards;
        }

        #imageBox {
            display: none;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border-radius: 20px;
            padding: 15px;
            margin-top: 15px;
            width: 100%;
            animation: fadeInWarning 0.5s ease forwards;
        }

        #imageBox img {
            max-width: 100%;
            max-height: 180px;
            object-fit: contain;
            border-radius: 12px;
        }

        @keyframes fadeInWarning {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .main-card { padding: 20px 15px; border-radius: 24px; }
            h1 { font-size: 1.2rem; }
            #descText { font-size: 0.95rem; }
            .btn-group { flex-direction: column; gap: 10px; }
            button.choice { width: 100%; padding: 12px; }
        }
    </style>
    <!-- Подключаем библиотеку Supabase в самом начале -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="bg-animate" id="bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <div class="main-card" id="mainContainer">
        <img src="https://s3.twcstorage.ru/df06c409-d71b78f0-64cf-4b11-a85a-d2bdbccb2f77/esgame/sitelogo.png" class="logo" id="logo">
        
        <div id="authBox">
            <h1 style="font-size: 1.2rem; margin-bottom: 20px;">Добро пожаловать в игру Алко-Властелин</h1>
            <p style="margin-bottom: 20px; font-size: 0.9rem; opacity: 0.8;">Введите ваш PIN код расположенный внутри коробки под карточками.</p>
            <input type="password" id="pinInput" placeholder="Введите PIN-код" 
                style="width: 100%; padding: 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.3); 
                background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); color: white; text-align: center; font-size: 1.2rem; margin-bottom: 20px;">
            <button class="choice choice-yes" onclick="checkPin()" style="width: 100%;">Войти</button>
        </div>

        <div id="gameContent" style="display: none; width: 100%;">
            <h1 id="title">Подготовка к ходу:<br>
Положите карту на стол так, чтобы все игроки видели выбранный уровень сложности.
Устройство должно находится рядом с картой.
Нажмите кнопку воспроизведения ниже.</h1>
            <button class="play-btn" id="playBtn" onclick="playTask()">▶</button>
            <div id="desc-box">
                <p id="descText"></p>
                <div class="btn-group" id="btnGroup">
                    <button class="choice choice-yes" onclick="finish()">Да</button>
                    <button class="choice choice-no" onclick="penalty()">Нет</button>
                </div>
                <div id="warningBox"></div>
                <div id="imageBox">
                    <img id="resultImage" src="" alt="Результат задания">
                </div>
            </div>
        </div>
    </div>

    <script>
        // Инициализация Supabase сразу
        const SUPABASE_URL = 'https://upngtdpgcorvcauuirjw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_t7gzRcNbsSTrOdC-4BygFA_gkVWrzsr';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentTask = null;
        let fullDescription = "";
        let mainPart = "";
        let warningPart = "";
        let splitIndex = -1;

        const params = new URLSearchParams(window.location.search);
        const cat = params.get('cat') || 'green';

        const configs = {
            green: { 
                primary: '#064e3b', secondary: '#10b981', b1: 'rgba(52, 211, 153, 0.4)', b2: 'rgba(4, 120, 87, 0.35)', penalty: 1, 
                image: 'https://s3.twcstorage.ru/df06c409-d71b78f0-64cf-4b11-a85a-d2bdbccb2f77/esgame/cash/1.png' 
            },
            yellow: { 
                primary: '#78350f', secondary: '#d97706', b1: 'rgba(251, 191, 36, 0.4)', b2: 'rgba(180, 83, 9, 0.35)', penalty: 2, 
                image: 'https://s3.twcstorage.ru/df06c409-d71b78f0-64cf-4b11-a85a-d2bdbccb2f77/esgame/cash/2.png' 
            },
            red: { 
                primary: '#7f1d1d', secondary: '#dc2626', b1: 'rgba(248, 113, 113, 0.4)', b2: 'rgba(153, 27, 27, 0.35)', penalty: 3, 
                image: 'https://s3.twcstorage.ru/df06c409-d71b78f0-64cf-4b11-a85a-d2bdbccb2f77/esgame/cash/3.png' 
            }
        };

        const currentConfig = configs[cat] || configs.green;
        const rootStyle = document.documentElement.style;
        rootStyle.setProperty('--bg-primary', currentConfig.primary);
        rootStyle.setProperty('--bg-secondary', currentConfig.secondary);
        rootStyle.setProperty('--blob-1', currentConfig.b1);
        rootStyle.setProperty('--blob-2', currentConfig.b2);

        // Загрузка фида
        fetch('https://s3.timeweb.cloud/df06c409-d71b78f0-64cf-4b11-a85a-d2bdbccb2f77/esgame/feed.xml')
            .then(res => res.text())
            .then(str => {
                const xml = new DOMParser().parseFromString(str, "text/xml");
                const offers = Array.from(xml.getElementsByTagName("offer")).filter(o => o.getElementsByTagName("categoryId")[0].textContent === cat);
                if (offers.length > 0) {
                    currentTask = offers[Math.floor(Math.random() * offers.length)];
                    fullDescription = currentTask.getElementsByTagName('description')[0].textContent;
                    
                    splitIndex = fullDescription.search(/внимание/i);
                    if (splitIndex !== -1) {
                        mainPart = fullDescription.substring(0, splitIndex).trim();
                        warningPart = fullDescription.substring(splitIndex);
                    } else {
                        mainPart = fullDescription;
                    }
                } else {
                    document.getElementById('title').innerText = "Нет заданий в этой категории";
                }
            })
            .catch(err => {
                document.getElementById('title').innerText = "Ошибка загрузки фида";
            });

        function playTask() {
            if (!currentTask) return;
            document.getElementById('playBtn').style.display = 'none';
            document.getElementById('title').innerText = currentTask.getElementsByTagName('name')[0].textContent;

            const box = document.getElementById('desc-box');
            box.style.opacity = '1';
            box.style.transform = 'translateY(0)';
            typeWriter(0);

            const audioTag = currentTask.getElementsByTagName('audio')[0];
            if (audioTag && audioTag.textContent.trim() !== "") {
                try {
                    const audio = new Audio(audioTag.textContent);
                    audio.play();
                } catch (e) {
                    console.log("Ошибка воспроизведения аудио:", e);
                }
            }
        }

        function typeWriter(i) {
            if (i < mainPart.length) {
                document.getElementById("descText").innerHTML += mainPart.charAt(i);
                setTimeout(() => typeWriter(i + 1), 25);
            } else {
                document.getElementById('btnGroup').style.opacity = '1';
                if (warningPart !== "") {
                    const warnBox = document.getElementById('warningBox');
                    warnBox.innerText = warningPart;
                    warnBox.style.display = 'block';
                }
            }
        }

        function penalty() {
            document.getElementById('title').innerText = "Внимание!";
            document.getElementById('descText').innerText = `Игрок кладет ${currentConfig.penalty} градус(а) в Алко-банк`;
            document.getElementById('btnGroup').style.display = 'none';
            document.getElementById('warningBox').style.display = 'none';
        }

        function finish() {
            document.getElementById('title').innerText = "Удачи!";
            document.getElementById('descText').innerText = "Задание принято!";
            document.getElementById('btnGroup').style.display = 'none';
            document.getElementById('warningBox').style.display = 'none';

            const imgBox = document.getElementById('imageBox');
            const resImg = document.getElementById('resultImage');
            resImg.src = currentConfig.image;
            imgBox.style.display = 'block';
        }

        async function checkPin() {
            const pin = document.getElementById('pinInput').value.trim();
            
            const { data, error } = await supabaseClient
                .from('decks') 
                .select('*')
                .eq('pin_code', pin)
                .maybeSingle();

            if (data) {
                localStorage.setItem('esgame_auth', 'true');
                document.getElementById('authBox').style.display = 'none';
                document.getElementById('gameContent').style.display = 'block';
            } else {
                alert("Неверный PIN-код");
            }
        }

        // Проверка сессии при загрузке
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('esgame_auth') === 'true') {
                document.getElementById('authBox').style.display = 'none';
                document.getElementById('gameContent').style.display = 'block';
            }
        });
    </script>
</body>
</html>
